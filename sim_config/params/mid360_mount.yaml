# =============================================================================
# LiDAR-IMU 外参配置 (MID360 安装角)
# =============================================================================
# 坐标系约定 (RA-LIO):
#   LiDAR系 ──[extrinsic_T/extrinsic_R]──► IMU系(Body系) ──[pos/rot]──► 世界系
#
# 仿真环境 (iris_mid360 in Gazebo):
#   MID360 安装在 iris base_link 上方 0.12m
#     <pose>0 0 0.12 0 0 0</pose>   ← 无旋转，与机身同向
#   IMU (PX4飞控) 位于 base_link 中心附近
#   结论: 仿真中 LiDAR 和 IMU 坐标轴同向 → extrinsic_R = 单位阵
#
# 真实无人机 (参考值，按实际安装修改):
#   MID360 典型安装角: 俯仰 -15° ~ +5° (前倾以看到更多地面)
#   IMU 在飞控内，与机体系之间可能有小角度偏移
# =============================================================================

# === RA-LIO LiDAR→IMU 外参 (载入方式: rosparam load) ===
# 平移: LiDAR系原点在IMU系下的坐标 [x, y, z] (单位: 米)
# 仿真值: 来自 mid360.yaml 的默认出厂标定值
extrinsic_T: [-0.011, -0.02329, 0.04412]

# 旋转: LiDAR系到IMU系的旋转矩阵 (行优先 3×3)
# 单位阵 = 两坐标系轴对齐
# 若MID360有安装角 (如绕Y轴俯仰 α)，改为:
#   [cosα,  0, sinα,
#    0,     1, 0,
#    -sinα, 0, cosα]
extrinsic_R: [1, 0, 0,
              0, 1, 0,
              0, 0, 1]

# 是否在线估计外参 (默认关闭)
# true: 外参作为状态量参与ESKF优化 (用于未标定场景)
# false: 使用上方固定外参
extrinsic_est_en: false

# === 坐标系诊断 ===
# 验证方法 (rosbag录制后):
#   1. rosrun tf tf_echo /mid360_link /base_link    -- LiDAR→机身
#   2. rosrun tf tf_echo /base_link /px4_imu        -- IMU→机身（仿真中可能有）
#   3. 检查RA-LIO初始化的重力方向: 期望 [0,0,-9.8] 附近
