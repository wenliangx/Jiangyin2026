# =============================================================================
# NMPC 悬停推力调试参数
# =============================================================================
# 使用方法:
#   roslaunch fsm_ctrl flight_fsm.launch nmpc_hover_thrust:=0.400
#
# 如需批量调参，可将本文件加载到节点私有命名空间:
#   rosparam load sim_config/params/nmpc_hover_tune.yaml /flight_fsm
#   roslaunch fsm_ctrl flight_fsm.launch
#
# 调整策略:
#   1. 无人机起飞后悬停，观察高度保持情况
#   2. 若反复掉高 → 增加 nmpc_hover_thrust (+0.01)
#   3. 若不断上升 → 减小 nmpc_hover_thrust (-0.01)
#   4. 爬升/下降速度通过 kp_z / kvd_z 调节
# =============================================================================

# === 悬停推力 (核心参数) ===
# 仿真 PX4 Iris (~1.5kg) 典型值 0.35~0.55
# 真实值取决于: 无人机质量、螺旋桨效率、电池电压、空气密度
nmpc_hover_thrust: 0.400

# === PID 位置-速度控制 (位置环 → 速度环 → NMPC参考) ===
# P gain - 位置比例
kp_x: 2.0
kp_y: 2.0
kp_z: 4.0
kp_yaw: 0.0

# I gain - 位置积分 (消除稳态误差)
kpi_x: 0.2
kpi_y: 0.2
kpi_z: 0.4
kpi_yaw: 0.0

# D gain - 位置微分
kpd_x: 0.0
kpd_y: 0.0
kpd_z: 0.0
kpd_yaw: 0.0

# P gain - 速度比例
kv_x: 4.0
kv_y: 4.0
kv_z: 6.0
kv_yaw: 0.0

# I gain - 速度积分
kvi_x: 0.0
kvi_y: 0.0
kvi_z: 0.0
kvi_yaw: 0.0

# D gain - 速度微分
kvd_x: 4.0
kvd_y: 4.0
kvd_z: 20.0
kvd_yaw: 0.0

# === NMPC 代价函数权重 ===
# Q matrix - 状态权重 (越大 → 越追求跟踪该状态量)
nmpc_mQ_px: 120   # 位置 X
nmpc_mQ_py: 120   # 位置 Y
nmpc_mQ_pz: 120   # 位置 Z
nmpc_mQ_vx: 1.0   # 速度 X
nmpc_mQ_vy: 1.0   # 速度 Y
nmpc_mQ_vz: 1.0   # 速度 Z
nmpc_mQ_q1: 3.0   # 姿态四元数 q1
nmpc_mQ_q2: 3.0   # 姿态四元数 q2
nmpc_mQ_q3: 3.0   # 姿态四元数 q3
nmpc_mQ_q4: 3.0   # 姿态四元数 q4

# R matrix - 控制量权重 (越大 → 控制越平缓)
nmpc_mR_a_BZ: 0.1  # 推力 Z
nmpc_mR_roll: 0.1  # 滚转角速率
nmpc_mR_pitch: 0.1 # 俯仰角速率
nmpc_mR_yaw: 0.1   # 偏航角速率

# === NMPC 代价函数权重 (完整NMPC) ===
nmpc_Qposx: 20.0   # 位置权重 X
nmpc_Qposy: 20.0   # 位置权重 Y
nmpc_Qposz: 50.0   # 位置权重 Z (高度权重更大)
nmpc_Qvelx: 1.0    # 速度权重 X
nmpc_Qvely: 1.0    # 速度权重 Y
nmpc_Qvelz: 1.0    # 速度权重 Z
nmpc_Qquatx: 1.0   # 姿态权重
nmpc_Qquaty: 1.0   # 姿态权重
nmpc_Qquatz: 1.0   # 姿态权重
nmpc_Rwx: 0.3      # 角速度权重 X
nmpc_Rwy: 0.3      # 角速度权重 Y
nmpc_Rwz: 0.3      # 角速度权重 Z
nmpc_RtotalF: 0.1  # 总推力权重

# === 内部轨迹生成 (无需ego-planner即可飞行) ===
# use_traj_gen=true 时, cmd=5 (轨迹跟踪) 使用内部生成器
use_traj_gen: true
traj_type: "waypoint"        # circle | square | waypoint
traj_cx: 0.0
traj_cy: 0.0
traj_alt: 1.0                # 飞行高度 [m]
traj_param1: 2.0             # circle→半径 | square→边长
traj_param2: 0.8             # 速度 [m/s]
traj_hold_time: 5.0          # 悬停等待时间 [s]

# 方形航点 (waypoint模式)
traj_waypoints:
  - [0.0, 0.0, 0.0]
  - [2.0, 0.0, 0.0]
  - [2.0, 2.0, 0.0]
  - [0.0, 2.0, 0.0]
  - [0.0, 0.0, 0.0]
