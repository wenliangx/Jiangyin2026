# =============================================================================
# RA-LIO 配置文件 —— Livox MID360 激光雷达
# =============================================================================
# 本文件被 launch/mapping_mid360.launch 中的 <rosparam> 标签加载
# 所有参数通过 ros::NodeHandle 在 laserMapping.cpp 的 main() 中读取
#
# 坐标系约定:
#   LiDAR系 → IMU系 (外参 extrinsic_T/R) → 世界系 (状态量 pos/rot)
# =============================================================================

# === 传感器话题配置 ===
common:
    lid_topic:  "/livox/lidar"   # LiDAR点云数据话题名
    imu_topic:  "/livox/imu"     # IMU数据话题名
    time_sync_en: false            # 是否自动同步IMU和LiDAR时间戳
                                  # true: 系统自动估算 LiDAR-IMU 时间偏移
                                  # false: 使用下面的固定偏移量
    time_offset_lidar_to_imu: 0.0 # LiDAR到IMU的固定时间偏移（秒）
                                  # LiDAR时间 = IMU时间 - time_offset
                                  # 如果不知道精确偏移，设为0.0即可
                                  # 可通过 LI-Init 等外参标定工具获得

# === 点云预处理参数 ===
preprocess:
    lidar_type: 1                # 激光雷达型号：
                                 #   1 = Livox AVIA/MID360（固态非重复扫描）
                                 #   2 = Velodyne VLP-16
                                 #   3 = Ouster OS1-64
                                 #   4 = 速腾聚创 RS-32
                                 #   5 = 万集 Vanjee-16
    scan_line: 4                 # Livox MID360 的扫描线数为 4
                                 # （Velodyne VLP-16 = 16，Ouster OS1-64 = 64 等）
    blind: 0.4                   # 盲区距离（米），小于此距离的激光点被过滤
                                 # MID360 最小测距约0.1m，这里滤掉0.4m内的点

# === 建图 & ESKF 参数 ===
mapping:
    # 输出世界系对齐模式：
    #   auto     - 启动静止后，根据 ESKF 重力方向自动锁存 roll/pitch
    #   fixed    - 使用下方固定 RPY，适合安装角已经准确测量的传感器
    #   disabled - 不补偿，直接输出 RA-LIO 内部世界系
    output_alignment_mode: fixed

    # 固定输出补偿角 [roll, pitch, yaw]，单位为度，旋转顺序 Rz*Ry*Rx。
    # 旧版 MID360 硬编码的实际合成变换等价于绕 Y 轴 +30°。
    fixed_output_alignment_rpy_deg: [0.0, 30.0, 0.0]

    # 重力基准只接受连续静止窗口。门限由历史实机 /livox/imu 启动段统计：
    # 静止时 acc_std/|acc|≈0.014、gyro_std≈0.005rad/s；运动时可超过
    # 0.04 和 0.025rad/s。窗口不合格会清零并重新累计，期间不发布里程计。
    imu_init_min_duration: 2.0
    imu_init_max_acc_std_ratio: 0.03
    imu_init_max_gyr_std: 0.02
    imu_init_max_mean_gyr: 0.08
    # 防止传感器方向、轴符号或数据源错误时锁存荒谬的重力补偿。
    # 当前机载 MID360 的实测安装倾角约31°。
    max_gravity_alignment_tilt_deg: 60.0

    acc_cov: 0.002                # 加速度计测量噪声协方差（每轴，m²/s⁴）
                                 # 越大 → 越不信任加速度计 → 更新时更依赖LiDAR
    gyr_cov: 0.002                 # 陀螺仪测量噪声协方差（每轴，rad²/s²）
                                 # 越大 → 越不信任陀螺仪 → 姿态更依赖LiDAR约束
    b_acc_cov: 0.001            # 加速度计 bias 随机游走噪声协方差
                                 # 控制 bias 估计的变化速率
    b_gyr_cov: 0.001            # 陀螺仪 bias 随机游走噪声协方差

    fov_degree:    360           # LiDAR 视场角（度），用于局部地图范围判定
                                 # MID360 水平视场角为360°，设为360

    det_range:     100.0         # 局部地图探测范围（米）
                                 # 当LiDAR靠近局部地图边界 < 1.5×det_range 时
                                 # 地图会自动向运动方向滑动

    extrinsic_est_en:  false     # 是否在线估计 LiDAR→IMU 外参
                                 # true: 外参作为状态量参与优化（用于未标定场景）
                                 # false: 使用下方固定外参值（标定后用此模式）

    # LiDAR 到 IMU 的外参（LiDAR系在IMU系下的位姿）
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]  # 平移 [x, y, z] 单位：米
                                                 # MID360出厂外参，实际可根据标定修改

    extrinsic_R: [ 1, 0, 0,                      # 旋转矩阵（行优先 3×3）
                   0, 1, 0,                      # 当前为单位阵，表示LiDAR和IMU
                   0, 0, 1]                      # 坐标轴方向一致

# === 发布控制 ===
publish:
    path_en:  true               # 是否发布运动轨迹 (nav_msgs::Path, /path话题)
    speed_vector_en: false       # 是否发布速度向量可视化箭头 (rviz Marker)
                                 # 开启后会持续发布，可在rviz中查看运动方向
    scan_publish_en:  true       # 是否发布点云（主开关）
                                 # false: 关闭所有点云输出（节省带宽和CPU）
    dense_publish_en: true       # 是否发布稠密点云
                                 # true: 发布去畸变后的全部点云
                                 # false: 发布降采样后的稀疏点云（减少数据量）
    scan_bodyframe_pub_en: true  # 是否额外发布 IMU坐标系(Body系)的点云
                                 # true: 同时发布 /cloud_registered_body 话题

# === PCD 文件保存 ===
pcd_save:
    pcd_save_en: false           # 是否保存点云到PCD文件
    interval: -1                 # 每多少帧LiDAR保存一个PCD文件
                                 # -1 : 所有帧合并保存为一个PCD文件
                                 #       （帧数过多时可能内存溢出）
                                 # N  : 每N帧保存一个文件，文件名 scans_1.pcd, scans_2.pcd...
