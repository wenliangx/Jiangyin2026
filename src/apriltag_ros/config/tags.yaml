# # Definitions of tags to detect
#
# ## General remarks
#
# - All length in meters
# - 'size' refers to the length of the shared border between solid black and solid white rectangle.
#   See README.md or https://github.com/AprilRobotics/apriltag/wiki/AprilTag-User-Guide#pose-estimation for details.
# - Ellipsis (...) signifies that the previous element can be repeated multiple times.
#
# ## Standalone tag definitions
# ### Remarks
#
# - name is optional
#
# ### Syntax
#
# standalone_tags:
#   [
#     {id: ID, size: SIZE, name: NAME},
#     ...
#   ]
standalone_tags:
  [
      {id: 0, size: 0.14, name: Tag36h11_0 }, # id 对应于生成标签的ID号，size对应标签的大小(单位:米)
      {id: 1, size: 0.14, name: Tag36h11_1 },
      {id: 2, size: 0.14, name: Tag36h11_2 },
      {id: 3, size: 0.14, name: Tag36h11_3 },
      {id: 4, size: 0.14, name: Tag36h11_4 },
      {id: 5, size: 0.14, name: Tag36h11_5 },
      {id: 6, size: 0.14, name: Tag36h11_6 },
      {id: 7, size: 0.14, name: Tag36h11_7 },
      {id: 8, size: 0.14, name: Tag36h11_8 },
      {id: 9, size: 0.14, name: Tag36h11_9 },
      {id: 10, size: 0.14, name: Tag36h11_10 },
  ]
# ## Tag bundle definitions
# ### Remarks
#
# - name is optional
# - x, y, z have default values of 0 thus they are optional
# - qw has default value of 1 and qx, qy, qz have default values of 0 thus they are optional
#
# ### Syntax
#
# tag_bundles:
#   [
#     {
#       name: 'CUSTOM_BUNDLE_NAME',
#       layout:
#         [
#           {id: ID, size: SIZE, x: X_POS, y: Y_POS, z: Z_POS, qw: QUAT_W_VAL, qx: QUAT_X_VAL, qy: QUAT_Y_VAL, qz: QUAT_Z_VAL},
#           ...
#         ]
#     },
#     ...
#   ]
tag_bundles:
  [
    {
      name: 'my_bundle',
      layout:
        [
          # {id: 0, size: 0.151, x: 0.50000, y: 0.80000, z: 0.0000, qw: 1.0000, qx: 0.0000, qy: 0.0000, qz: 0.0000}
          # {id: 5, size: 0.072, x: 0.0000, y: 0.0000, z: 0.0000, qw: 1.0000, qx: 0.0000, qy: 0.0000, qz: 0.0000},
          # {id: 6, size: 0.072, x: 0.5000, y: 0.8000, z: 0.0000, qw: 1.0000, qx: 0.0000, qy: 0.0000, qz: 0.0000},
          # {id: 7, size: 0.072, x: -0.0580, y: -0.0553, z: 0.0000, qw: 1.0000, qx: 0.0000, qy: 0.0000, qz: 0.0000},
          # {id: 8, size: 0.072, x: 0.0543, y: 0.0603, z: 0.0000, qw: 1.0000, qx: 0.0000, qy: 0.0000, qz: 0.0000},
        ]
    }
  ]
