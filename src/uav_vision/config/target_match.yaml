matcher:
  canonical_size: 256
  border_crop_fraction: 0.04
  canny_low: 60
  canny_high: 160
  min_area_ratio: 0.005
  max_area_ratio: 0.80
  polygon_epsilon_ratio: 0.03
  min_side_ratio: 0.60
  max_angle_cosine: 0.35
  max_candidates: 5
  # Competition boards are white sheets on red brick-pattern walls. The HSV
  # path prevents thin mortar lines from merging the sheet into a non-convex
  # Canny contour. Values were replay-tested on front_target/001 from the venue.
  white_board_enabled: true
  white_max_saturation: 60
  white_min_value: 170
  white_open_kernel: 5
  white_close_kernel: 5
  white_min_fill_ratio: 0.65
  white_max_area_ratio: 0.20
  # Keep close=5 as the primary path. Only when it produces no accepted
  # candidate, retry the white mask with close=11 and stricter class gates.
  white_fallback_enabled: true
  white_fallback_close_kernel: 11
  white_fallback_min_class_score: 0.70
  white_fallback_min_class_margin: 0.10
  white_fallback_max_candidates: 1
  # Blue competition posters are attempted only after both primary matching
  # and the strict white fallback fail.
  blue_fallback_enabled: true
  blue_min_hue: 80
  blue_max_hue: 140
  blue_min_saturation: 25
  blue_min_value: 50
  blue_open_kernel: 3
  blue_close_kernel: 11
  blue_min_fill_ratio: 0.35
  blue_max_area_ratio: 0.08
  blue_min_class_score: 0.75
  blue_min_class_margin: 0.10
  blue_max_candidates: 1
  min_target_side_px: 80.0
  min_sharpness: 20.0
  gray_weight: 0.50
  hog_weight: 0.30
  color_weight: 0.20
  min_class_score: 0.60
  min_class_margin: 0.03
  min_candidate_margin: 0.02
  orb_nfeatures: 1200
  orb_max_width: 960
  orb_ratio_test: 0.75
  orb_ransac_reproj_px: 5.0
  orb_min_good_matches: 12
  orb_min_inliers: 10
  orb_min_inlier_ratio: 0.45
  orb_min_inlier_margin: 5
  akaze_max_width: 960
  akaze_ratio_test: 0.80
  akaze_ransac_reproj_px: 5.0
  akaze_min_good_matches: 10
  akaze_min_inliers: 8
  akaze_min_inlier_ratio: 0.45
  akaze_min_inlier_margin: 4
  augmentations:
    - {}
    - {brightness: -25}
    - {brightness: 25}
    - {contrast: 0.85}
    - {contrast: 1.15}
    - {gamma: 0.85}
    - {gamma: 1.15}
    - {blur: 3}
    - {blur: 5}
    - {angle: -3.0}
    - {angle: 3.0}
    - {scale: 0.97}
    - {scale: 1.03}
    - {color_shift: [-8, 0, 8]}
    - {color_shift: [8, 0, -8]}

temporal:
  vote_window: 5
  min_stable_votes: 3
  target_lost_frames: 3

publish_debug_image: true

# Raw/result recording runs on a bounded background queue. Each classifier
# overrides the stream name to front_target or rear_target.
recording:
  enabled: true
  root: /home/flag/vision_recordings
  fps: 10.0
  codec: mp4v
  extension: .mp4
  segment_seconds: 300.0
  inactivity_seconds: 3.0
  queue_size: 2
