odom_topic: /Odometry
cloud_topic: /cloud_registered
global_odom_topic: /Odometry_lio_global
map_cloud_topic: /map_building_cloud
state_topic: /map_frame_manager/state
ready_topic: /map_frame_manager/ready

map_frame: lio_global
local_frame: world
body_frame: body

# false: save the map in its unanchored LIO frame. Set the permanent origin later.
define_origin_during_mapping: false
# Used only when define_origin_during_mapping is true (legacy workflow).
auto_lock_origin: true
stability_duration: 3.0
stability_timeout: 30.0
max_linear_speed: 0.05
max_angular_speed: 0.03
max_position_stddev: 0.03
max_yaw_stddev: 0.0174533
minimum_cloud_frames: 20

map_leaf_size: 0.10
compact_every_frames: 50
# Hand-carried mapping removes the operator from the working map while retaining
# an unfiltered *_raw.pcd for recovery and manual inspection.
handheld_mapping: true
operator_exclusion:
  enabled: true
  max_odom_age: 0.20
  min: [-0.8, -0.8, -2.0]
  max: [0.8, 0.8, -0.15]
map_output_directory: /tmp/jiangyin_map
map_name: competition_map
save_on_shutdown: true
minimum_save_points: 1000
