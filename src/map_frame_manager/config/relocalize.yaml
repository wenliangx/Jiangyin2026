# Competition runtime: vehicle is physically at permanent (0,0,0).
# Translation, roll and pitch are fixed; only yaw is searched.
map_file: ""
map_frame: lio_global
local_frame: world
body_frame: body
odom_topic: /Odometry
cloud_topic: /cloud_registered
global_odom_topic: /Odometry_lio_global
map_topic: /prior_map
aligned_topic: /relocalization/aligned_cloud
status_topic: /relocalization/initialized
state_topic: /map_frame_manager/state
fitness_topic: /map_frame_manager/fitness
transform_topic: /relocalization/world_from_lio_local

map_leaf_size: 0.08
scan_leaf_size: 0.08
origin_map_radius: 15.0
accumulate_frames: 20
coarse_yaw_step_deg: 2.0
fine_yaw_step_deg: 0.05
fine_yaw_window_deg: 2.0
max_correspondence_distance: 0.40
minimum_overlap_ratio: 0.45
maximum_rmse: 0.20
ambiguity_separation_deg: 15.0
minimum_score_margin: 0.02
overlap_penalty_weight: 0.50
required_consistent_results: 3
maximum_yaw_consistency_deg: 0.30
max_linear_speed: 0.05
max_angular_speed: 0.03
