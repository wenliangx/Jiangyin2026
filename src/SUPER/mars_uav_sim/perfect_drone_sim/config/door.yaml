#############| For UAV simulation |#################################
pcd_name: "b.pcd"
mesh_resource: "package://perfect_drone_sim/meshes/yunque-M.dae"
init_position:
  x: 1
  y: 1
  z: 0.5
init_yaw: 0.0

#############|For LiDAR perception simulation |#################################
is_360lidar: true
polar_resolution: 0.2
downsample_res: 0.05
vertical_fov: 178.0
sensing_blind: 0.1
sensing_horizon: 10
sensing_rate: 15
print_time_consumption: false

# 环形锥体扫描范围（机体系：+X 向前，+Z 向上）
# 扫描轴从无人机正上方（+Z）朝前方（+X）倾斜 30 度；
# 仅保留视线与扫描轴夹角在 [38, 97] 度内的点。
conical_fov_en: true
lidar_axis_tilt_deg: 30.0
lidar_fov_min_angle_deg: 38.0
lidar_fov_max_angle_deg: 97.0

#  enum LiDARType{
#  UNDEFINED = 0,
#  AVIA = 1,
#  GENERAL_360 = 2,
#  MID_360 = 3
#  };
lidar_type: 2
depth_image_en: false


