# ============================================================================
# docker-compose.yml  —  Single-container Jiangyin2026 dev environment
#
# ONE service (jy) runs the unified jiangyin_jy2026 image: PX4 SITL + Gazebo +
# algorithm stack, all inside a single container (ROS master on localhost).
#
# Usage:
#   podman-compose up -d          # start jy (default: headless SITL + dev shell)
#   podman-compose up -d --profile gui   # attach Gazebo GUI (needs GPU/X11)
#   podman-compose down           # stop
#
# The entrypoint is jy-docker.sh; modes are shell/sitl/gui/dev/stack/all.
#   command: jy-docker.sh all    # SITL (bg) + algorithm stack (fg)
#   command: jy-docker.sh sitl   # PX4 SITL headless only
#   command: jy-docker.sh dev    # compile /ws/src, then interactive shell
# ============================================================================

version: "3"

services:
  jy:
    image: localhost/jiangyin_jy2026:latest
    container_name: jy
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_IP=127.0.0.1
      - HEADLESS=1
    volumes:
      - .:/ws:Z
    command: jy-docker.sh all
    restart: "no"

  gui:
    image: localhost/jiangyin_jy2026:latest
    container_name: jy-gui
    profiles: ["gui"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_IP=127.0.0.1
      - HEADLESS=
    volumes:
      - .:/ws:Z
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: jy-docker.sh gui
    depends_on:
      - jy
    restart: "no"
