version: "3"

# PX4 SITL, Gazebo, MID360 bridge, RA-LIO and FSM/NMPC run in one container.
# No GPU is required: the simulated lidar uses Gazebo's CPU ray sensor.
services:
  sim-stack:
    image: localhost/jiangyin_sim_stack:latest
    container_name: jiangyin-sim-stack
    environment:
      ROS_MASTER_URI: http://localhost:11311
      ROS_IP: 127.0.0.1
      HEADLESS: "1"
      PX4_SIM_MODEL: iris_mid360
      PX4_SIM_WORLD: obstacle_test
    command: all
    shm_size: 1gb
    restart: "no"
